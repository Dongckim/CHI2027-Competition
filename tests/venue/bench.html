<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venue bench</title>
<!-- Bench page (V6, #7): checks that route.js + data/venue work in a browser, laid out like the Figma
     "09 Getting there" draft. Not the app UI: the final design is not out yet. -->
<style>
  :root { --ink: #111; --muted: #555; --map: #e9dcc6; --room: #f6ecdb; --wall: #cbb89a; --line: #ddd; }
  * { box-sizing: border-box; }
  body { font: 16px system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 420px; color: var(--ink); background: #fff; }
  h1 { font-size: 18px; margin: 4px 0 16px; }
  .controls { border: 1px dashed #aaa; padding: 8px; margin-bottom: 16px; font-size: 14px; }
  .controls label { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  select { font-size: 16px; min-height: 44px; flex: 1; min-width: 0; }
  #rooms, #levels { color: var(--muted); font-size: 14px; margin: 0; }
  #time { font-size: 32px; font-weight: 800; margin: 2px 0; }
  .map { background: var(--map); border-radius: 12px; padding: 8px; margin: 12px 0; }
  .map svg { width: 100%; height: auto; display: block; }
  .map .level { font-size: 12px; font-weight: 700; margin: 4px 4px 2px; }
  .map .caption { font-size: 12px; color: var(--muted); margin: 4px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; min-height: 48px;
            border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  .toggle input { width: 24px; height: 24px; }
  ol { padding-left: 20px; font-size: 14px; }
  .muted { color: var(--muted); font-size: 13px; }
  pre { font-size: 12px; overflow-x: auto; background: #f4f4f4; padding: 8px; }
</style>
</head>
<body>
<div class="controls">
  <b>Bench</b> (pick rooms)
  <label>From <select id="from"></select></label>
  <label>To <select id="to"></select></label>
</div>

<h1>Getting there</h1>
<p id="rooms"></p>
<p id="time" aria-live="polite"></p>
<p id="levels"></p>
<div id="maps"></div>
<label class="toggle">Step-free route (via elevator) <input type="checkbox" id="stepFree"></label>
<ol id="via"></ol>
<p class="muted" id="note"></p>
<p class="muted" id="buildNote"></p>
<details><summary>route() output</summary><pre id="json"></pre></details>

<script type="module">
import { route } from '../../app/src/venue/route.js';

const get = path => fetch(`../../data/${path}`).then(r => (r.ok ? r.json() : null));
const edition = await get('venue/chi2026.json');
const venue = await get(`venue/${edition.venue}.json`);
const feedRooms = await get('build/chi2026/rooms.json'); // optional: needs npm run data:build
const names = new Map((feedRooms || []).map(r => [r.key, r.name]));

// one option per feed room, labelled with the feed's room name
const options = Object.entries(edition.rooms)
  .map(([key, area]) => ({ key, area, label: names.get(key) || `${area} (${key})` }))
  .sort((a, b) => a.label.localeCompare(b.label, 'en', { numeric: true }));
for (const sel of [from, to]) sel.innerHTML = options.map(o => `<option value="${o.key}">${o.label}</option>`).join('');
// ?from=P1-113&to=P1-133&stepFree=1 (area ids or feed room keys) to open a given route
const q = new URLSearchParams(location.search);
const pick = v => options.find(o => o.key === v || o.area === v)?.key;
from.value = pick(q.get('from')) || pick('P1-111');
to.value = pick(q.get('to')) || pick('P2-211');
stepFree.checked = q.get('stepFree') === '1';
if (!feedRooms) buildNote.textContent = 'Room names need npm run data:build; showing area ids.';

const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const N = venue.nodes;
// single rooms only (combinations like "113+114" overlap their parts)
const outlines = Object.entries(venue.areas).filter(([, a]) => a.rect && !a.name.includes('+'));

function drawLevel(level, r) {
  const onLevel = r.path.filter(n => N[n].level === level && N[n].x != null);
  // frame: the route on this level plus the start/end rooms, with room around it
  const pts = onLevel.map(n => [N[n].x, N[n].y]);
  // keep the Elevator/Escalator label (drawn above its node, ~20 m wide) inside the frame
  for (const n of onLevel) if (N[n].kind === 'elevator' || N[n].kind === 'escalator') pts.push([N[n].x - 12, N[n].y - 10], [N[n].x + 12, N[n].y]);
  for (const id of [r.from, r.to]) {
    const a = venue.areas[id];
    if (a.level === level && a.rect) pts.push([a.rect[0], a.rect[1]], [a.rect[2], a.rect[3]]);
  }
  let [x0, y0, x1, y1] = [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
  const grow = (lo, hi, min) => { const pad = Math.max(10, (min - (hi - lo)) / 2); return [lo - pad, hi + pad]; };
  [x0, x1] = grow(x0, x1, 70);
  [y0, y1] = grow(y0, y1, 45);
  const W = x1 - x0;
  const fs = W / 26, sw = W / 160;

  // a booked combination (M215+M216, Areas 1+2+3) highlights its parts
  const parts = id => {
    const a = venue.areas[id];
    if (!a.name.includes('+')) return [id];
    const [prefix, rest] = a.name.startsWith('Areas ') ? ['Area ', a.name.slice(6)] : ['', a.name];
    return rest.split('+').map(p => `${a.level}-${(prefix + p).toLowerCase().replace(/ /g, '-')}`);
  };
  const ends = new Set([...parts(r.from), ...parts(r.to)]);
  const rooms = outlines.filter(([, a]) => a.level === level).map(([id, a]) => {
    const [ax0, ay0, ax1, ay1] = a.rect;
    const mine = ends.has(id);
    const label = a.name.length > 6 ? a.name.replace(' Room', '').replace(' Hall', '') : a.name;
    return `<rect x="${ax0}" y="${ay0}" width="${ax1 - ax0}" height="${ay1 - ay0}" fill="#f6ecdb" stroke="${mine ? '#111' : '#cbb89a'}" stroke-width="${mine ? sw * 1.5 : sw}"/>
      <text x="${(ax0 + ax1) / 2}" y="${(ay0 + ay1) / 2 + fs * 0.35}" font-size="${Math.min(fs, (ax1 - ax0) / 3)}" text-anchor="middle" fill="${mine ? '#111' : '#7a6a52'}" ${mine ? 'font-weight="700"' : ''}>${esc(label)}</text>`;
  }).join('');
  const line = onLevel.length > 1 ? `<polyline points="${onLevel.map(n => `${N[n].x},${N[n].y}`).join(' ')}" fill="none" stroke="#111" stroke-width="${sw * 2.2}" stroke-dasharray="${sw * 5} ${sw * 3}" stroke-linejoin="round"/>` : '';
  // where the route changes level on this floor
  const lift = onLevel.find(n => N[n].kind === 'elevator' || N[n].kind === 'escalator');
  const liftLabel = lift ? (() => {
    const t = N[lift].kind === 'elevator' ? 'Elevator' : 'Escalator';
    const w = fs * 0.62 * t.length + fs;
    // above the node, unless a pin sits there: then below it
    const nearPin = [r.path[0], r.path.at(-1)].some(p => N[p].level === level && Math.hypot(N[p].x - N[lift].x, N[p].y - N[lift].y) < fs * 3);
    const top = nearPin ? N[lift].y + fs * 0.7 : N[lift].y - fs * 2.2;
    return `<rect x="${N[lift].x - w / 2}" y="${top}" width="${w}" height="${fs * 1.5}" rx="${fs * 0.4}" fill="#fff8e8" stroke="#cbb89a" stroke-width="${sw / 2}"/>
      <text x="${N[lift].x}" y="${top + fs * 1.1}" font-size="${fs * 0.9}" text-anchor="middle" font-weight="600">${t}</text>`;
  })() : '';
  const pin = (id, text, dark) => N[id].level === level && N[id].x != null
    ? `<circle cx="${N[id].x}" cy="${N[id].y}" r="${fs * 0.95}" fill="${dark ? '#111' : '#fff'}" stroke="#111" stroke-width="${sw * 1.5}"/>
       <text x="${N[id].x}" y="${N[id].y + fs * 0.35}" font-size="${fs}" text-anchor="middle" font-weight="700" fill="${dark ? '#fff' : '#111'}">${text}</text>` : '';
  return `<div class="level">Level ${level}</div>
    <svg viewBox="${x0} ${y0} ${W} ${y1 - y0}" role="img" aria-label="Level ${level}: route on the floor plan">
      <rect x="${x0}" y="${y0}" width="${W}" height="${y1 - y0}" fill="#e9dcc6"/>${rooms}${line}${liftLabel}${pin(r.path[0], 'A')}${pin(r.path.at(-1), 'B', true)}</svg>`;
}

function show() {
  const a = edition.rooms[from.value], b = edition.rooms[to.value];
  const r = route(venue, a, b, { stepFree: stepFree.checked });
  rooms.textContent = `${from.selectedOptions[0].text} → ${to.selectedOptions[0].text}`;
  json.textContent = JSON.stringify(r, null, 2);
  if (!r) { time.textContent = 'No route'; levels.textContent = via.innerHTML = maps.innerHTML = ''; return; }
  const [lo, hi] = r.minutes;
  time.textContent = `about ${lo === hi ? lo : `${lo}–${hi}`} min`;
  levels.textContent = `${r.metres} m · ${r.levels.length > 1 ? `Level ${r.levels[0]} → Level ${r.levels.at(-1)}` : `Level ${r.levels[0]}`}`;
  via.innerHTML = r.via.map(v => `<li>${v.kind === 'elevator' ? 'Elevator' : 'Escalator'} ${v.from} → ${v.to}</li>`).join('');
  // a level the route only rides through (no walking there) gets a line, not a map
  const walked = l => r.path.some(n => N[n].level === l && N[n].kind !== 'elevator' && N[n].kind !== 'escalator');
  maps.innerHTML = `<div class="map">${r.levels
    .map(l => (l === 'AUD' ? '<p class="level">Auditorium: via the connecting walkway from P0 access A (no plan)</p>'
      : walked(l) ? drawLevel(l, r) : `<p class="level">Level ${l}: ride through</p>`))
    .join('')}<p class="caption">Floor plan from CCIB floor plans · pins only</p></div>`;
  const guessed = r.path.filter(n => N[n].estimate);
  note.textContent = guessed.length ? `Estimated, not measured on the plan: ${guessed.join(', ')}` : '';
}
for (const el of [from, to, stepFree]) el.addEventListener('change', show);
show();
</script>
</body>
</html>
